# See https://github.com/github/safe-settings/blob/main-enterprise/docs/sample-settings/suborg.yml
# for example layout

suborgrepos:
  - '*'

environments:
  - name: production
    deployment_branch_policy:
      protected_branches: false
      custom_branch_policies:
        - names: [main]
          type: branch
    wait_timer: 0
    variables:
      - name: SAFE_SETTINGS_APP_ID
        value: '2781473'
  - name: test
    variables:
      - name: SAFE_SETTINGS_APP_ID
        value: '2798053'

repository:
  # As we use `semantic-release` throughout the formulas, which means every
  # commit message is important, we disallow squash merging so that commit
  # messages are not inadvertently destroyed.
  # In addition, Renovate defaults to squash merging unless the repository
  # settings disallows it.
  allow_squash_merge: false

  # Allow auto-merging to allow Renovate to work more efficiently
  allow_auto_merge: true

rulesets:
  - name: Prevent destruction of the default branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: deletion
      - type: non_fast_forward
  - name: Require status checks before updating the default branch
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: required_status_checks
        parameters:
          required_status_checks:
            - context: Release / Collect results
              integration_id: 15368
          strict_required_status_checks_policy: false
  - name: Require PR approvals before updating the default branch
    target: branch
    enforcement: active
    bypass_actors:
      # Renovate[bot]
      - actor_id: 2740
        actor_type: Integration
        bypass_mode: exempt
    conditions:
      ref_name:
        include:
          - ~DEFAULT_BRANCH
        exclude: []
    rules:
      - type: pull_request
        parameters:
          dismiss_stale_reviews_on_push: false
          require_code_owner_review: false
          require_last_push_approval: true
          required_approving_review_count: 1
          required_review_thread_resolution: true
